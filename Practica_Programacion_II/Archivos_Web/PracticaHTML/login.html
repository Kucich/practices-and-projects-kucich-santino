<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    
    <h1>Inicio de sesión</h1>

    <label for="form">Complete los campos DNI y CLAVE con sus datos para poder ingresar.</label>

    <br>
    <br>


    <form action="">

        <fieldset>
            <legend>Campos de Inicio de sesión</legend>
    
            <br>
    
            <label for="dni">Documento DNI</label><br>
            <input type="text" id="dni" placeholder="Ingrese su documento DNI" required>
    
            <br>
            <br>
    
            <label for="password">Clave</label><br>
            <input type="text" id="password" placeholder="Ingrese su clave de inicio" required><br>
    
            <br>
            <label for="checkbox">Recordar mis datos</label>
            <input type="checkbox" id="checkbox"><br>
            
            <br>
    
            <button>Ingresar</button>
    
        </fieldset>

    </form>

    

</body>
</html>
